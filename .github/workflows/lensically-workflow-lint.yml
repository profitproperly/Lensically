name: Lensically workflow lint

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "lensically-worker/scripts/validate-engineering-workflow.rb"
      - "lensically-worker/scripts/validate-workflow-yaml.rb"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  parse-engineering-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Parse and validate engineering workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(ruby lensically-worker/scripts/validate-workflow-yaml.rb && ruby lensically-worker/scripts/validate-engineering-workflow.rb .github/workflows/lensically-engineering.yml 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            description="$(printf '%s\n' "$output" | grep -v '^ | head -n 1)"
            description="${description:-workflow_lint_failed}"
            description="${description:0:140}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context='lensically/workflow-lint' \
              -f description="$description" >/dev/null
            exit "$status"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='lensically/workflow-lint' \
            -f description='workflow_lint_passed' >/dev/null
