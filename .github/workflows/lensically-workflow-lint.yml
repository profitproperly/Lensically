name: Lensically workflow lint

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "lensically-worker/scripts/validate-engineering-workflow.rb"
      - "lensically-worker/scripts/validate-workflow-yaml.rb"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-engineering-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Parse and validate engineering workflow
        run: ruby lensically-worker/scripts/validate-workflow-yaml.rb && ruby lensically-worker/scripts/validate-engineering-workflow.rb .github/workflows/lensically-engineering.yml
