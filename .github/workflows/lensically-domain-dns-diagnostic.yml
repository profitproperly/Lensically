name: Lensically Domain DNS Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect public DNS and Pages domain state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo '--- public DNS ---'
          echo "root-a=$(dig +short A lensically.com | paste -sd, -)"
          echo "root-aaaa=$(dig +short AAAA lensically.com | paste -sd, -)"
          echo "root-cname=$(dig +short CNAME lensically.com | paste -sd, -)"
          echo "www-cname=$(dig +short CNAME www.lensically.com | paste -sd, -)"
          echo "api-cname=$(dig +short CNAME api.lensically.com | paste -sd, -)"
          echo "app-cname=$(dig +short CNAME app.lensically.com | paste -sd, -)"
          echo '--- http topology ---'
          curl -sSIL --max-redirs 0 https://lensically.com/ 2>/dev/null | sed -n '1,12p' || true
          curl -sSIL --max-redirs 0 https://lensically-operator.pages.dev/ 2>/dev/null | sed -n '1,12p' || true
          echo '--- Pages domain state ---'
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_missing');
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/lensically-operator/domains/lensically.com`;
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
          const payload = await response.json().catch(() => null);
          if (!response.ok || !payload?.success) throw new Error(`pages_domain_lookup_failed_${response.status}`);
          const result = payload.result || {};
          console.log(`status=${result.status || 'unknown'}`);
          console.log(`validation-status=${result.validation_data?.status || 'unknown'}`);
          console.log(`validation-method=${result.validation_data?.method || 'unknown'}`);
          console.log(`validation-error=${result.validation_data?.error_message || 'none'}`);
          console.log(`verification-status=${result.verification_data?.status || 'unknown'}`);
          console.log(`verification-error=${result.verification_data?.error_message || 'none'}`);
          NODE
