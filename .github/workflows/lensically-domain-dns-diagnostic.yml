name: Lensically Final Domain DNS Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect public DNS and final domain state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo '--- public DNS ---'
          echo "root-a=$(dig +short A lensically.com | paste -sd, -)"
          echo "root-aaaa=$(dig +short AAAA lensically.com | paste -sd, -)"
          echo "root-cname=$(dig +short CNAME lensically.com | paste -sd, -)"
          echo "www-cname=$(dig +short CNAME www.lensically.com | paste -sd, -)"
          echo "api-cname=$(dig +short CNAME api.lensically.com | paste -sd, -)"
          echo "app-cname=$(dig +short CNAME app.lensically.com | paste -sd, -)"
          echo '--- http topology ---'
          curl -sSIL --max-redirs 0 https://lensically.com/ 2>/dev/null | sed -n '1,12p' || true
          curl -sSIL --max-redirs 0 https://app.lensically.com/ 2>/dev/null | sed -n '1,12p' || true
          curl -sSIL --max-redirs 0 https://api.lensically.com/api/operator/health 2>/dev/null | sed -n '1,12p' || true
          echo '--- Cloudflare Pages projects ---'
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_missing');
          const api = 'https://api.cloudflare.com/client/v4';
          const response = await fetch(`${api}/accounts/${account}/pages/projects`, { headers: { Authorization: `Bearer ${token}` } });
          const payload = await response.json().catch(() => null);
          if (!response.ok || !payload?.success) throw new Error(`pages_project_list_failed_${response.status}`);
          for (const project of payload.result || []) {
            const domains = Array.isArray(project.domains) ? project.domains.join(',') : 'none';
            if (project.name.includes('lensically') || domains.includes('lensically')) {
              console.log(`pages-project=${project.name};domains=${domains};production=${project.production_branch || 'unknown'}`);
            }
          }
          NODE
                    echo 'diagnostic-complete'

  http_redirects_to_https:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require HTTP to HTTPS redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --silent --show-error --dump-header "$headers" --output /dev/null --max-redirs 0 http://lensically.com/operator/ || true
          grep -Eiq '^HTTP/.* (301|302|307|308)' "$headers"
          grep -Eiq '^location: https://lensically\.com/operator/?' "$headers"

  https_threads_user_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require secure page delivery for Meta in-app browser user agent
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --user-agent 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 [FBAN/Threads]' \
            https://lensically.com/operator/ \
            | grep -Fq 'id="embedded-checkout"'


