name: Remove Accidental Cloudflare Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact inactive deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT_NAME: lensically-worker
          DEPLOYMENT_ID: 9c07a83b-c5eb-4c18-aec7-8d265af20471
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/deployments"
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${base}/${DEPLOYMENT_ID}" > /tmp/delete-deployment.json
          jq -e '.success == true' /tmp/delete-deployment.json >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${base}" > /tmp/deployments.json
          jq -e --arg id "${DEPLOYMENT_ID}" '.success == true and ([.result[]?.id] | index($id) | not)' /tmp/deployments.json >/dev/null
