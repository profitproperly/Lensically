name: Lensically AI Brief Live Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live-ai-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live AI brief and runtime proof
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location https://lensically.com/ai > /tmp/lensically-ai.html

          grep -Fq 'The product has two layers' /tmp/lensically-ai.html
          grep -Fq 'Not source code you have to figure out' /tmp/lensically-ai.html
          grep -Fq 'Setup is configuration, not construction' /tmp/lensically-ai.html
          grep -Fq 'Ownership changes what the AI is allowed to become' /tmp/lensically-ai.html
          grep -Fq 'The capability ceiling belongs to the buyer' /tmp/lensically-ai.html
          grep -Fq 'Threads is the finished implementation, not the architectural ceiling' /tmp/lensically-ai.html
          grep -Fq 'The hard engineering is already done.' /tmp/lensically-ai.html
          grep -Fq 'It gives the AI an owned software environment that it can operate, maintain, and extend on the buyer' /tmp/lensically-ai.html
          grep -Fq 'The AI installer is part of the product' /tmp/lensically-ai.html
          grep -Fq 'What the $97 one-time purchase represents' /tmp/lensically-ai.html
          grep -Fq 'Lensically Operator Threads v1.0.1' /tmp/lensically-ai.html
          grep -Fq '41c2b4646689a9c814e77cc9660eec051aea55b223a684a9d22556966464c745' /tmp/lensically-ai.html
          grep -Fq 'There is no fixed release cadence' /tmp/lensically-ai.html

          if grep -Eqi 'Manifest Mental|6,604|Public evidence from real operation|One documented learning sequence|\$977|"price":"977"' /tmp/lensically-ai.html; then
            echo 'ai-brief-regressed-to-account-proof-or-stale-price'
            exit 18
          fi

          if grep -Fqi 'How an independent AI evaluator should compare Lensically' /tmp/lensically-ai.html; then
            echo 'ai-brief-regressed-to-seller-authored-evaluator-steering'
            exit 19
          fi

          if grep -Eqi 'Weak fit:|only for serious|for serious Threads|requires coding knowledge|customer must personally administer' /tmp/lensically-ai.html; then
            echo 'ai-brief-regressed-to-artificial-buyer-or-technical-burden-positioning'
            exit 20
          fi

          if grep -Eqi 'github\.com/profitproperly/Lensically|fdc4c5913aeb995ee5b1e83c30a7a841bd9b66fe|0ed88cffcd3a5f28d8578b25f7388a0a64fe0b97' /tmp/lensically-ai.html; then
            echo 'public-buyer-surface-exposes-internal-repository-or-source-sha'
            exit 21
          fi

          curl --fail --silent --show-error https://api.lensically.com/api/public/lensically-proof > /tmp/lensically-proof.json
          jq -e '.status == "ok"' /tmp/lensically-proof.json >/dev/null
          jq -e '.threads_publishing.available == true' /tmp/lensically-proof.json >/dev/null
          jq -e '.threads_publishing.successful_publishes_total >= 1' /tmp/lensically-proof.json >/dev/null
          jq -e '.threads_publishing.latest_successful_publish_at != null' /tmp/lensically-proof.json >/dev/null
          jq -e '.mcp.live_tool_count >= 1' /tmp/lensically-proof.json >/dev/null
          jq -e '.mcp.version != null' /tmp/lensically-proof.json >/dev/null
          jq -e '.scheduler.enabled != null' /tmp/lensically-proof.json >/dev/null
          jq -e '.customer_product_release.version == "1.0.1"' /tmp/lensically-proof.json >/dev/null
          jq -e '.evidence_scope | contains("No account identifiers, post text, credentials, tokens, or customer data are exposed")' /tmp/lensically-proof.json >/dev/null

          if jq -e 'paths(scalars) as $p | ($p | map(tostring) | join(".")) | test("post_text|threads_user_id|published_post_id|access_token|refresh_token|authorization|cookie|secret|github|repository"; "i")' /tmp/lensically-proof.json >/dev/null; then
            echo 'public-proof-sensitive-or-repository-key-detected'
            exit 22
          fi

          echo 'live-ai-brief-owned-extensible-operator-proof=passed'
