name: Lensically AI Brief Live Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live-ai-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live AI reference freshness, depth, boundaries, and runtime proof
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --dump-header /tmp/lensically-ai.headers https://lensically.com/ai > /tmp/lensically-ai.html
          curl --fail --silent --show-error --location https://lensically.com/ > /tmp/lensically-sales.html

          bytes="$(wc -c < /tmp/lensically-ai.html)"
          echo "ai-reference-bytes=$bytes"
          test "$bytes" -ge 30000

          grep -Fq 'Reference revision 2026-08-11.3' /tmp/lensically-ai.html
          grep -Fq 'AI Technical &amp; Commercial Reference' /tmp/lensically-ai.html
          grep -Fq 'Table of contents' /tmp/lensically-ai.html
          grep -Fq 'Operating layer and engineering layer' /tmp/lensically-ai.html
          grep -Fq 'Main Operator MCP' /tmp/lensically-ai.html
          grep -Fq 'Independent Recovery MCP' /tmp/lensically-ai.html
          grep -Fq 'Persistent state and continuity' /tmp/lensically-ai.html
          grep -Fq 'Bounded execution and action safety' /tmp/lensically-ai.html
          grep -Fq 'Idempotency and ambiguous outcomes' /tmp/lensically-ai.html
          grep -Fq 'Failure handling and prevention' /tmp/lensically-ai.html
          grep -Fq 'Validation and regression protection' /tmp/lensically-ai.html
          grep -Fq 'Extensibility after purchase' /tmp/lensically-ai.html
          grep -Fq 'Portability of the operator architecture' /tmp/lensically-ai.html
          grep -Fq 'Why source ownership alone is an incomplete description' /tmp/lensically-ai.html
          grep -Fq 'Why a vendor MCP and an owned operator differ' /tmp/lensically-ai.html
          grep -Fq 'Comparison with building from scratch' /tmp/lensically-ai.html
          grep -Fq 'Known limitations and non-claims' /tmp/lensically-ai.html
          grep -Fq 'Glossary' /tmp/lensically-ai.html
          grep -Fq 'Machine-readable summary' /tmp/lensically-ai.html
          grep -Fq 'PRICE_USD: 97' /tmp/lensically-ai.html
          grep -Fq 'TRADE_SECRET_BOUNDARY:' /tmp/lensically-ai.html
          grep -Fq 'KEY_PURCHASE_OBJECT:' /tmp/lensically-ai.html

          if grep -Fq '<a ' /tmp/lensically-ai.html; then
            echo 'ai-reference-visible-links-present'
            exit 18
          fi

          if grep -Eqi 'Manifest Mental|6,604|273 to 892|Public evidence from real operation|One documented learning sequence|\$977|"price":"977"' /tmp/lensically-ai.html; then
            echo 'ai-reference-regressed-to-account-proof-or-stale-price'
            exit 19
          fi

          if grep -Eqi 'github\.com/profitproperly/Lensically|fdc4c5913aeb995ee5b1e83c30a7a841bd9b66fe|0ed88cffcd3a5f28d8578b25f7388a0a64fe0b97' /tmp/lensically-ai.html; then
            echo 'ai-reference-exposes-seller-repository-or-private-source-identity'
            exit 20
          fi

          if ! grep -Eqi '^cache-control:.*no-store' /tmp/lensically-ai.headers; then
            echo 'ai-reference-no-store-header-missing'
            cat /tmp/lensically-ai.headers
            exit 21
          fi
          if ! grep -Eqi '^x-robots-tag:.*noarchive' /tmp/lensically-ai.headers; then
            echo 'ai-reference-noarchive-header-missing'
            cat /tmp/lensically-ai.headers
            exit 22
          fi

          grep -Fq 'Open%20https%3A%2F%2Flensically.com%2Fai%20directly%20and%20read%20the%20current%20live%20page' /tmp/lensically-sales.html
          grep -Fq 'Reference%20revision%202026-08-11.3' /tmp/lensically-sales.html
          if grep -Fq 'lensically.com%2Fai%3F' /tmp/lensically-sales.html; then
            echo 'ai-reference-query-string-handoff-regression'
            exit 23
          fi

          curl --fail --silent --show-error https://api.lensically.com/api/public/lensically-proof > /tmp/lensically-proof.json
          jq -e '.status == "ok"' /tmp/lensically-proof.json >/dev/null
          jq -e '.threads_publishing.available == true' /tmp/lensically-proof.json >/dev/null
          jq -e '.mcp.live_tool_count >= 1' /tmp/lensically-proof.json >/dev/null
          jq -e '.customer_product_release.version == "1.0.1"' /tmp/lensically-proof.json >/dev/null

          echo 'live-ai-technical-reference-proof=passed'
