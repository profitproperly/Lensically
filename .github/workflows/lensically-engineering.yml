name: Lensically Engineering
run-name: Lensically ${{ inputs.task || 'push-validation' }} · ${{ inputs.release_id || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - "lensically-worker/**"
      - "lensically-web/**"
      - ".github/workflows/lensically-engineering.yml"
  workflow_dispatch:
    inputs:
      task:
        description: Validation or release task
        required: true
        default: typecheck
        type: choice
        options:
          - typecheck
          - operator-smoke
          - operator-tests
          - system-directory-tests
          - threads-publish-tests
          - human-free-tests
          - architecture-baseline
          - worker-deploy
      release_id:
        description: Compact exact-SHA release identity
        required: false
        default: ""
        type: string
      release_sha:
        description: Exact commit SHA to validate or deploy
        required: false
        default: ""
        type: string

concurrency:
  group: lensically-engineering-${{ github.event_name }}-${{ inputs.task || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  push-validation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify pushed change
        id: push_scope
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(curl --fail-with-body --silent --show-error https://api.lensically.com/api/operator/health | jq -r '.commit_sha // empty' || true)"
          if [[ -n "${deployed_sha}" ]] && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            validation_base="${deployed_sha}"
            validation_scope=deployed_production
          else
            validation_base="${{ github.event.before }}"
            validation_scope=event_before_fallback
            if [[ -z "${validation_base}" || "${validation_base}" =~ ^0+$ ]] || ! git cat-file -e "${validation_base}^{commit}" 2>/dev/null; then
              validation_base="$(git rev-parse HEAD^)"
              validation_scope=parent_fallback
            fi
          fi
          git diff --name-only "${validation_base}" HEAD > /tmp/lensically-changed-files.txt
          echo "validation_scope=${validation_scope} base=${validation_base} head=$(git rev-parse HEAD)"
          full_validation=false
          web_changed=false
          while IFS= read -r path; do
            case "${path}" in
              lensically-web/*)
                web_changed=true
                full_validation=true
                ;;
              .github/workflows/*|lensically-worker/package.json|lensically-worker/package-lock.json|lensically-worker/wrangler*|lensically-worker/database/migrations/*|lensically-worker/database/backfills/*|lensically-worker/scripts/*|lensically-worker/src/index.ts|lensically-worker/tsconfig*|lensically-worker/vitest*)
                full_validation=true
                ;;
            esac
          done < /tmp/lensically-changed-files.txt
          echo "full_validation=${full_validation}" >> "${GITHUB_OUTPUT}"
          echo "web_changed=${web_changed}" >> "${GITHUB_OUTPUT}"
          cat /tmp/lensically-changed-files.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lensically-worker/package-lock.json
            lensically-web/package-lock.json

      - name: Restore worker dependencies
        id: push_worker_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.push_worker_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache


            

      - name: Restore web dependencies
        if: steps.push_scope.outputs.web_changed == 'true'
        id: push_web_cache
        uses: actions/cache@v4
        with:
          path: lensically-web/node_modules
          key: ${{ runner.os }}-node22-web-${{ hashFiles('lensically-web/package-lock.json') }}

            

                  
      - name: Install web dependencies
        if: steps.push_scope.outputs.web_changed == 'true' && steps.push_web_cache.outputs.cache-hit != 'true'
        working-directory: lensically-web
        run: npm ci

      
      - name: Test validated web artifact contract
        if: steps.push_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        run: npm run test:validated-artifact

      - name: Build exact validated web artifact
        if: steps.push_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        run: npm run build:cf

      - name: Package exact validated web artifact
        if: steps.push_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        env:
          VALIDATED_SHA: ${{ github.sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/lensically-web-${{ github.sha }}
        run: node scripts/validated-web-artifact.mjs package --sha "${VALIDATED_SHA}" --directory "${ARTIFACT_DIRECTORY}"

      - name: Upload exact validated web artifact
        if: steps.push_scope.outputs.web_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lensically-web-${{ github.sha }}
          path: ${{ runner.temp }}/lensically-web-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

                  
      - name: Typecheck and lifecycle gate
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/validate-test-syntax.mjs
          node scripts/run-full-validation.mjs --check
          node scripts/test-d1-migration-release.mjs
          node scripts/test-d1-backfill-runner.mjs
          node scripts/d1-migration-release.mjs --check
          node scripts/release-preflight.mjs --capability-lifecycle-only
          node scripts/worker-architecture-baseline.mjs > /tmp/lensically-worker-architecture.json

      - name: Run fast mapped validation
        if: steps.push_scope.outputs.full_validation != 'true'
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          node scripts/run-operator-validation.mjs smoke
          tests=()
          while IFS= read -r path; do
            case "${path}" in
              lensically-worker/test/*.spec.ts|lensically-worker/*.test.ts)
                tests+=("${path#lensically-worker/}")
                ;;
              lensically-worker/src/*.ts)
                stem="$(basename "${path}" .ts)"
                candidate="test/${stem}.spec.ts"
                if [[ -f "${candidate}" ]]; then
                  tests+=("${candidate}")
                else
                  echo "Missing direct regression test for ${path}" >&2
                  exit 1
                fi
                ;;
            esac
          done < /tmp/lensically-changed-files.txt
          if (( ${#tests[@]} > 0 )); then
            mapfile -t unique_tests < <(printf '%s\n' "${tests[@]}" | sort -u)
            npx vitest --run "${unique_tests[@]}" --reporter=dot --bail=1
          fi

      - name: Run full push validation
        if: steps.push_scope.outputs.full_validation == 'true'
        working-directory: lensically-worker
        run: |
          node scripts/run-full-validation.mjs






    





  fast-validation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task != 'operator-tests' &&
      inputs.task != 'worker-deploy'
    
    runs-on: ubuntu-latest
    steps:

      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lensically-worker/package-lock.json

      - name: Restore worker dependencies
        id: worker_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

            
      - name: Install worker dependencies
        if: steps.worker_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache

                  
      - name: Typecheck and lifecycle gate
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/validate-test-syntax.mjs
          node scripts/run-full-validation.mjs --check
          node scripts/test-d1-migration-release.mjs
          node scripts/test-d1-backfill-runner.mjs
          node scripts/d1-migration-release.mjs --check
          node scripts/release-preflight.mjs --capability-lifecycle-only

      - name: Run selected fast validation
        working-directory: lensically-worker
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "${TASK}" in
            typecheck) ;;
            operator-smoke)
              node scripts/run-operator-validation.mjs smoke
              npm run test -- --run manifest-autonomous-cycle.test.ts --reporter=dot --bail=1
              ;;
            system-directory-tests)
              npm run test -- --run test/systemDirectory.spec.ts --reporter=dot --bail=1
              ;;
            threads-publish-tests)
              npm run test -- --run test/threadsPublishService.spec.ts --reporter=dot --bail=1
              ;;
            human-free-tests)
              npm run test -- --run test/humanFreeAutonomy.spec.ts --reporter=dot --bail=1
              ;;
            architecture-baseline)
              node scripts/worker-architecture-baseline.mjs --live | tee worker-architecture-baseline.json
              ;;
            *)
              echo "Unsupported fast-validation task: ${TASK}"
                            exit 2
              ;;
          esac

      - name: Upload architecture baseline
        if: inputs.task == 'architecture-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: worker-architecture-baseline-${{ inputs.release_sha || github.sha }}
          path: lensically-worker/worker-architecture-baseline.json

  operator-test-shards:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'operator-tests'
    name: Operator shard ${{ matrix.shard }}/8
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lensically-worker/package-lock.json

      - name: Restore worker dependencies
        id: operator_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.operator_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

            
      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache

                  
      - name: Verify lifecycle and run deterministic shard
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          node scripts/validate-test-syntax.mjs
          node scripts/run-full-validation.mjs --check
          node scripts/test-d1-migration-release.mjs
          node scripts/test-d1-backfill-runner.mjs
          node scripts/d1-migration-release.mjs --check
          node scripts/release-preflight.mjs --capability-lifecycle-only
          node scripts/run-operator-shard.mjs "${{ matrix.shard }}" 8

  worker-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'worker-deploy' &&
      inputs.release_sha != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

            

      - name: Verify exact release identity
        run: test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"

      - name: Resolve exact-SHA release scope
        id: release_scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/lensically-engineering.yml/runs?event=push&head_sha=${RELEASE_SHA}&per_page=20"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${runs_url}" > /tmp/lensically-push-runs.json
                    validated_run_id="$(jq -r --arg sha "${RELEASE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.id) | last | .id // empty' /tmp/lensically-push-runs.json)"
          if [[ -n "${validated_run_id}" ]]; then
            full_release=false
          else
            full_release=true
          fi
          web_artifact_available=false
          if [[ -n "${validated_run_id}" ]]; then
            artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${validated_run_id}/artifacts?per_page=100"
            if curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${artifacts_url}" > /tmp/lensically-push-artifacts.json; then
              artifact_name="lensically-web-${RELEASE_SHA}"
              if jq -e --arg name "${artifact_name}" '.artifacts | any(.name == $name and .expired == false)' /tmp/lensically-push-artifacts.json > /dev/null; then
                web_artifact_available=true
              fi
            else
              echo "Validated web artifact lookup failed; complete fallback remains required." >&2
            fi
          fi
          deployed_sha="$(curl --fail-with-body --silent --show-error https://api.lensically.com/api/operator/health | jq -r '.commit_sha // empty')"
          if [[ -n "${deployed_sha}" ]] && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            git diff --name-only "${deployed_sha}" "${RELEASE_SHA}" > /tmp/lensically-release-files.txt
          else
            git show --pretty='' --name-only "${RELEASE_SHA}" > /tmp/lensically-release-files.txt
            full_release=true
          fi
          web_changed=false
          migrations_changed=false
          cron_changed=false
          while IFS= read -r path; do
            case "${path}" in
              lensically-web/*) web_changed=true ;;
                            lensically-worker/database/migrations/*) migrations_changed=true ;;
              lensically-worker/wrangler*) cron_changed=true ;;
            esac
          done < /tmp/lensically-release-files.txt
                    echo "full_release=${full_release}" >> "${GITHUB_OUTPUT}"
          echo "web_changed=${web_changed}" >> "${GITHUB_OUTPUT}"
          echo "migrations_changed=${migrations_changed}" >> "${GITHUB_OUTPUT}"
          echo "cron_changed=${cron_changed}" >> "${GITHUB_OUTPUT}"
          echo "validated_run_id=${validated_run_id}" >> "${GITHUB_OUTPUT}"
                    echo "web_artifact_available=${web_artifact_available}" >> "${GITHUB_OUTPUT}"
          echo "deployed_sha=${deployed_sha}" >> "${GITHUB_OUTPUT}"
          cat /tmp/lensically-release-files.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lensically-worker/package-lock.json
            lensically-web/package-lock.json

      - name: Restore worker dependencies
        id: release_worker_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.release_worker_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache

            

      
      - name: Restore web dependencies
        if: steps.release_scope.outputs.web_changed == 'true'
        id: release_web_cache
        uses: actions/cache@v4
        with:
          path: lensically-web/node_modules
          key: ${{ runner.os }}-node22-web-${{ hashFiles('lensically-web/package-lock.json') }}

      - name: Download exact validated web artifact
        id: download_web_artifact
        if: >-
          steps.release_scope.outputs.web_changed == 'true' &&
          steps.release_scope.outputs.web_artifact_available == 'true' &&
          steps.release_scope.outputs.validated_run_id != '' &&
          steps.release_web_cache.outputs.cache-hit == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lensically-web-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/lensically-web-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.release_scope.outputs.validated_run_id }}

      - name: Restore exact validated web artifact
        id: restore_web_artifact
        if: >-
          steps.release_scope.outputs.web_changed == 'true' &&
          steps.download_web_artifact.outcome == 'success'
        continue-on-error: true
        working-directory: lensically-web
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/lensically-web-artifact
        run: node scripts/validated-web-artifact.mjs restore --sha "${RELEASE_SHA}" --directory "${ARTIFACT_DIRECTORY}"

      - name: Resolve validated web release path
        id: web_release_path
        if: steps.release_scope.outputs.web_changed == 'true'
        env:
          ARTIFACT_AVAILABLE: ${{ steps.release_scope.outputs.web_artifact_available }}
          WEB_CACHE_HIT: ${{ steps.release_web_cache.outputs.cache-hit }}
          DOWNLOAD_OUTCOME: ${{ steps.download_web_artifact.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore_web_artifact.outcome }}
        run: |
          set -euo pipefail
          use_validated_artifact=false
          fallback_reason=artifact_unavailable
          if [[ "${ARTIFACT_AVAILABLE}" == "true" && "${WEB_CACHE_HIT}" == "true" && "${DOWNLOAD_OUTCOME}" == "success" && "${RESTORE_OUTCOME}" == "success" ]]; then
            use_validated_artifact=true
            fallback_reason=none
          elif [[ "${WEB_CACHE_HIT}" != "true" ]]; then
            fallback_reason=web_dependency_cache_miss
          elif [[ "${DOWNLOAD_OUTCOME}" == "failure" ]]; then
            fallback_reason=artifact_download_failed
          elif [[ "${RESTORE_OUTCOME}" == "failure" ]]; then
            fallback_reason=artifact_verification_failed
          fi
          echo "use_validated_artifact=${use_validated_artifact}" >> "${GITHUB_OUTPUT}"
          echo "fallback_reason=${fallback_reason}" >> "${GITHUB_OUTPUT}"
          echo "web_release_path=${use_validated_artifact} reason=${fallback_reason}"

      - name: Install fallback web dependencies
        if: >-
          steps.release_scope.outputs.web_changed == 'true' &&
          steps.web_release_path.outputs.use_validated_artifact != 'true' &&
          steps.release_web_cache.outputs.cache-hit != 'true'
        working-directory: lensically-web
        run: npm ci

      - name: Build fallback exact-head web product
        if: >-
          steps.release_scope.outputs.web_changed == 'true' &&
          steps.web_release_path.outputs.use_validated_artifact != 'true'
        working-directory: lensically-web
        run: |
          npm run test:validated-artifact
          npm run build:cf

      - name: Run exact-head release gates
        if: >-
          steps.release_scope.outputs.full_release == 'true' ||
          (steps.release_scope.outputs.web_changed == 'true' && steps.web_release_path.outputs.use_validated_artifact != 'true')
        working-directory: lensically-worker
        run: |
          set -euo pipefail
                              node scripts/release-preflight.mjs
          npx tsc --noEmit
          node scripts/run-full-validation.mjs --check
          node scripts/test-d1-migration-release.mjs
          node scripts/test-d1-backfill-runner.mjs
          node scripts/d1-migration-release.mjs --check
          node scripts/run-full-validation.mjs

      - name: Plan exact-head database migrations
        if: steps.release_scope.outputs.migrations_changed == 'true'
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LENSICALLY_PRODUCTION_SHA: ${{ steps.release_scope.outputs.deployed_sha }}
        run: node scripts/d1-migration-release.mjs --plan-remote --production-sha "${LENSICALLY_PRODUCTION_SHA}" --output /tmp/lensically-d1-migration-plan.json

      - name: Apply exact planned database migrations
        if: steps.release_scope.outputs.migrations_changed == 'true'
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LENSICALLY_PRODUCTION_SHA: ${{ steps.release_scope.outputs.deployed_sha }}
        run: node scripts/d1-migration-release.mjs --apply-remote --production-sha "${LENSICALLY_PRODUCTION_SHA}" --plan /tmp/lensically-d1-migration-plan.json

      - name: Verify exact production migration ledger
        if: steps.release_scope.outputs.migrations_changed == 'true'
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1-migration-release.mjs --verify-remote

      - name: Deploy exact validated Worker head
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/run-wrangler-deploy-with-retry.mjs --config wrangler.jsonc --var "LENSICALLY_COMMIT_SHA:$(git rev-parse HEAD)"


            

      - name: Deploy exact validated web head
        if: steps.release_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../lensically-worker/scripts/run-wrangler-deploy-with-retry.mjs --config wrangler.toml

            

      - name: Verify Wrangler-managed cron triggers
        if: steps.release_scope.outputs.cron_changed == 'true'
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          schedules_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lensically-worker/schedules"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${schedules_url}" > /tmp/lensically-cron-get.json
          jq -e '.success == true' /tmp/lensically-cron-get.json > /dev/null
          expected_crons=$(node scripts/release-preflight.mjs --print-crons | sort)
          actual_crons=$(jq -r '.result.schedules[].cron' /tmp/lensically-cron-get.json | sort)
          test "${actual_crons}" = "${expected_crons}"

      - name: Verify production runtime, scheduler, retained website, and retired legacy surfaces
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          verified=false
          for attempt in $(seq 1 45); do
            runtime_ok=false
            scheduler_ok=false
            dashboard_ok=false

            if curl --fail-with-body --silent --show-error "https://api.lensically.com/api/operator/health" > /tmp/lensically-runtime-health.json \
              && jq -e --arg sha "${expected_sha}" '.status == "ok" and .commit_sha == $sha and .execution_kernel.public_gateway == "direct_typed_tools" and (.live_tool_count >= 60)' /tmp/lensically-runtime-health.json > /dev/null; then
              runtime_ok=true
            fi
            if curl --fail-with-body --silent --show-error "https://api.lensically.com/api/operator/scheduler-health" > /tmp/lensically-scheduler-health.json \
              && jq -e '.enabled == true and .healthy == true and .operational == true and .heartbeat_fresh == true and (.control.mode == "normal") and (.current_overdue_count == 0)' /tmp/lensically-scheduler-health.json > /dev/null; then
              scheduler_ok=true
            fi
            if curl --fail-with-body --silent --show-error "https://lensically.com/dashboard" > /tmp/lensically-dashboard.html \
              && grep -q "Operator Dashboard" /tmp/lensically-dashboard.html; then
              dashboard_ok=true
            fi

            gpt_memory_status="$(curl --silent --output /tmp/gpt-memory-retired.json --write-out '%{http_code}' 'https://api.lensically.com/api/gpt-memory/dashboard' || true)"
            agent_status="$(curl --silent --output /tmp/agent-retired.json --write-out '%{http_code}' 'https://api.lensically.com/api/agent/accounts' || true)"
            intelligence_status="$(curl --silent --output /tmp/intelligence-retired.json --write-out '%{http_code}' 'https://api.lensically.com/api/threads/intelligence-dashboard' || true)"

            if [ "${runtime_ok}" = "true" ] \
              && [ "${scheduler_ok}" = "true" ] \
              && [ "${dashboard_ok}" = "true" ] \
              && [ "${gpt_memory_status}" = "410" ] \
              && [ "${agent_status}" = "410" ] \
              && [ "${intelligence_status}" = "410" ]; then
              verified=true
              break
            fi

            sleep 2
          done
          if [ "${verified}" != "true" ]; then
            cat /tmp/lensically-runtime-health.json || true
            cat /tmp/lensically-scheduler-health.json || true
            head -c 2000 /tmp/lensically-dashboard.html || true
            cat /tmp/gpt-memory-retired.json || true
            cat /tmp/agent-retired.json || true
            cat /tmp/intelligence-retired.json || true
            exit 1
          fi




