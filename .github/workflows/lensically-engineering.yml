name: Lensically Engineering
run-name: Lensically ${{ inputs.task || 'push-validation' }} · ${{ inputs.release_id || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - "lensically-worker/**"
      - "lensically-web/**"
      - ".github/workflows/lensically-engineering.yml"
  workflow_dispatch:
    inputs:
      task:
        description: Validation or release task
        required: true
        default: typecheck
        type: choice
        options:
          - typecheck
          - operator-smoke
          - operator-tests
          - system-directory-tests
          - threads-publish-tests
          - human-free-tests
          - architecture-baseline
          - worker-deploy
      release_id:
        description: Compact exact-SHA release identity
        required: false
        default: ""
        type: string
      release_sha:
        description: Exact commit SHA to validate or deploy
        required: false
        default: ""
        type: string

concurrency:
  group: lensically-engineering-${{ github.event_name }}-${{ inputs.task || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  push-validation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify pushed change
        id: push_scope
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "${before}" HEAD > /tmp/lensically-changed-files.txt
          full_validation=false
          web_changed=false
          while IFS= read -r path; do
            case "${path}" in
              lensically-web/*)
                web_changed=true
                full_validation=true
                ;;
              .github/workflows/*|lensically-worker/package.json|lensically-worker/package-lock.json|lensically-worker/wrangler*|lensically-worker/migrations/*|lensically-worker/scripts/*|lensically-worker/src/index.ts|lensically-worker/tsconfig*|lensically-worker/vitest*)
                full_validation=true
                ;;
            esac
          done < /tmp/lensically-changed-files.txt
          echo "full_validation=${full_validation}" >> "${GITHUB_OUTPUT}"
          echo "web_changed=${web_changed}" >> "${GITHUB_OUTPUT}"
                    cat /tmp/lensically-changed-files.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lensically-worker/package-lock.json
            lensically-web/package-lock.json

      - name: Restore worker dependencies
        id: push_worker_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.push_worker_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache


            

      - name: Restore web dependencies
        if: steps.push_scope.outputs.web_changed == 'true'
        id: push_web_cache
        uses: actions/cache@v4
        with:
          path: lensically-web/node_modules
          key: ${{ runner.os }}-node22-web-${{ hashFiles('lensically-web/package-lock.json') }}

            

      - name: Install web dependencies
        if: steps.push_scope.outputs.web_changed == 'true' && steps.push_web_cache.outputs.cache-hit != 'true'
        working-directory: lensically-web
        run: npm ci

      - name: Build web product surface
        if: steps.push_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        run: npm run build

      - name: Typecheck and lifecycle gate
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/validate-test-syntax.mjs
          node scripts/release-preflight.mjs --capability-lifecycle-only
          node scripts/worker-architecture-baseline.mjs > /tmp/lensically-worker-architecture.json

            

      - name: Run fast mapped validation
        if: steps.push_scope.outputs.full_validation != 'true'
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          node scripts/run-operator-validation.mjs smoke
          tests=()
          while IFS= read -r path; do
            case "${path}" in
              lensically-worker/test/*.spec.ts|lensically-worker/*.test.ts)
                tests+=("${path#lensically-worker/}")
                ;;
              lensically-worker/src/*.ts)
                stem="$(basename "${path}" .ts)"
                candidate="test/${stem}.spec.ts"
                if [[ -f "${candidate}" ]]; then
                  tests+=("${candidate}")
                else
                  echo "Missing direct regression test for ${path}" >&2
                  exit 1
                fi
                ;;
            esac
          done < /tmp/lensically-changed-files.txt
          if (( ${#tests[@]} > 0 )); then
            mapfile -t unique_tests < <(printf '%s\n' "${tests[@]}" | sort -u)
            npx vitest --run "${unique_tests[@]}" --reporter=dot --bail=1
          fi

      - name: Run full push validation
        if: steps.push_scope.outputs.full_validation == 'true'
        working-directory: lensically-worker
        run: |
          set -euo pipefail
                    node scripts/run-operator-validation.mjs smoke
                    npm run test -- --run test/databaseMigrations.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpProtocol.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpToolDefinitions.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpToolDirectory.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpEngineeringRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAdminRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAccountFoundationRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpSourceDraftRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpStrategyScheduleRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpManifestCycleRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAutonomousExecutionRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAccountAnalyticsRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpRegistryComposition.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpRoutingPolicy.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpTransport.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpDispatcher.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpToolCallDispatcher.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestCycleService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorHourlyCoverageService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestPrepareCheckpointService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestCycleConstructionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestPersistenceAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestPersistenceService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestScheduledReviewService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestCycleObservationService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorAccountStateService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorLensicallyUiSurfaceService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewBatchRetirementService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewBatchStateService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewDraftAttachmentService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewSourceResolutionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewBatchSchedulingService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorWorkflowSessionStartService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorContextAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorProductionBoardService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCandidateListService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSavedPatternSourceExclusionService.spec.ts --reporter=dot --bail=1
                              npm run test -- --run test/operatorManifestSourceDrawService.spec.ts --reporter=dot --bail=1
          npm run test -- --run test/operatorPublishedPostLineageAuditService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestSourceCardBackfillService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestSourceCardBackfillPreparationService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCandidateBatchReadService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardFamilyResolutionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardPersistencePlanningService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardLockService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardReadService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorGenerationRunAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorGenerationRunPersistencePlanningService.spec.ts --reporter=dot --bail=1
          npm run test -- --run test/wranglerDeployRetry.spec.ts --reporter=dot --bail=1
          npm run test -- --run manifest-autonomous-cycle.test.ts --reporter=dot --bail=1
          npm run test -- --run test/humanFreeAutonomy.spec.ts --reporter=dot --bail=1






    





  fast-validation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task != 'operator-tests' &&
      inputs.task != 'worker-deploy'
    
    runs-on: ubuntu-latest
    steps:

      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lensically-worker/package-lock.json

      - name: Restore worker dependencies
        id: worker_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.worker_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache

      
      - name: Typecheck and lifecycle gate
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          npx tsc --noEmit
          node scripts/validate-test-syntax.mjs
          node scripts/release-preflight.mjs --capability-lifecycle-only

      - name: Run selected fast validation
        working-directory: lensically-worker
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "${TASK}" in
            typecheck) ;;
            operator-smoke)
              node scripts/run-operator-validation.mjs smoke
              npm run test -- --run manifest-autonomous-cycle.test.ts --reporter=dot --bail=1
              ;;
            system-directory-tests)
              npm run test -- --run test/systemDirectory.spec.ts --reporter=dot --bail=1
              ;;
            threads-publish-tests)
              npm run test -- --run test/threadsPublishService.spec.ts --reporter=dot --bail=1
              ;;
            human-free-tests)
              npm run test -- --run test/humanFreeAutonomy.spec.ts --reporter=dot --bail=1
              ;;
            architecture-baseline)
              node scripts/worker-architecture-baseline.mjs --live | tee worker-architecture-baseline.json
              ;;
            *)
              echo "Unsupported fast-validation task: ${TASK}"
                            exit 2
              ;;
          esac

      - name: Upload architecture baseline
        if: inputs.task == 'architecture-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: worker-architecture-baseline-${{ inputs.release_sha || github.sha }}
          path: lensically-worker/worker-architecture-baseline.json

  operator-test-shards:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'operator-tests'
    name: Operator shard ${{ matrix.shard }}/8
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lensically-worker/package-lock.json

      - name: Restore worker dependencies
        id: operator_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.operator_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache

      - name: Verify lifecycle and run deterministic shard
        working-directory: lensically-worker
        run: |
          set -euo pipefail
          node scripts/validate-test-syntax.mjs
          node scripts/release-preflight.mjs --capability-lifecycle-only
          node scripts/run-operator-shard.mjs "${{ matrix.shard }}" 8

  worker-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'worker-deploy' &&
      inputs.release_sha != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

            

      - name: Verify exact release identity
        run: test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"

      - name: Resolve exact-SHA release scope
        id: release_scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/lensically-engineering.yml/runs?event=push&head_sha=${RELEASE_SHA}&per_page=20"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${runs_url}" > /tmp/lensically-push-runs.json
          if jq -e --arg sha "${RELEASE_SHA}" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' /tmp/lensically-push-runs.json > /dev/null; then
            full_release=false
          else
            full_release=true
          fi
          deployed_sha="$(curl --fail-with-body --silent --show-error https://api.lensically.com/api/operator/health | jq -r '.commit_sha // empty')"
          if [[ -n "${deployed_sha}" ]] && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            git diff --name-only "${deployed_sha}" "${RELEASE_SHA}" > /tmp/lensically-release-files.txt
          else
            git show --pretty='' --name-only "${RELEASE_SHA}" > /tmp/lensically-release-files.txt
            full_release=true
          fi
          web_changed=false
          migrations_changed=false
          cron_changed=false
          while IFS= read -r path; do
            case "${path}" in
              lensically-web/*) web_changed=true ;;
              lensically-worker/migrations/*) migrations_changed=true ;;
              lensically-worker/wrangler*) cron_changed=true ;;
            esac
          done < /tmp/lensically-release-files.txt
          echo "full_release=${full_release}" >> "${GITHUB_OUTPUT}"
          echo "web_changed=${web_changed}" >> "${GITHUB_OUTPUT}"
          echo "migrations_changed=${migrations_changed}" >> "${GITHUB_OUTPUT}"
          echo "cron_changed=${cron_changed}" >> "${GITHUB_OUTPUT}"
          cat /tmp/lensically-release-files.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lensically-worker/package-lock.json
            lensically-web/package-lock.json

      - name: Restore worker dependencies
        id: release_worker_cache
        uses: actions/cache@v4
        with:
          path: lensically-worker/node_modules
          key: ${{ runner.os }}-node22-worker-${{ hashFiles('lensically-worker/package-lock.json') }}

      - name: Install worker dependencies
        if: steps.release_worker_cache.outputs.cache-hit != 'true'
        working-directory: lensically-worker
        run: npm ci

      - name: Clear stale worker transforms
        working-directory: lensically-worker
        run: rm -rf node_modules/.vite node_modules/.cache

            

      - name: Restore web dependencies
        if: steps.release_scope.outputs.web_changed == 'true'
        id: release_web_cache
        uses: actions/cache@v4
        with:
          path: lensically-web/node_modules
          key: ${{ runner.os }}-node22-web-${{ hashFiles('lensically-web/package-lock.json') }}

            

      - name: Install web dependencies
        if: steps.release_scope.outputs.web_changed == 'true' && steps.release_web_cache.outputs.cache-hit != 'true'
        working-directory: lensically-web
        run: npm ci

            

      - name: Build exact-head web product
        if: steps.release_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        run: npm run build:cf

            

      - name: Run exact-head release gates
        if: steps.release_scope.outputs.full_release == 'true'
        working-directory: lensically-worker
        run: |
          set -euo pipefail
                    node scripts/release-preflight.mjs
          npx tsc --noEmit
                    npm run test -- --run test/databaseMigrations.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpProtocol.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpToolDefinitions.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpToolDirectory.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpEngineeringRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAdminRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAccountFoundationRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpSourceDraftRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpStrategyScheduleRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpManifestCycleRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAutonomousExecutionRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpAccountAnalyticsRegistry.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpRegistryComposition.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpRoutingPolicy.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpTransport.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpDispatcher.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorMcpToolCallDispatcher.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestCycleService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorHourlyCoverageService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestPrepareCheckpointService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestCycleConstructionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestPersistenceAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestPersistenceService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestScheduledReviewService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestCycleObservationService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorAccountStateService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorLensicallyUiSurfaceService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewBatchRetirementService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewBatchStateService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewDraftAttachmentService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewSourceResolutionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestReviewBatchSchedulingService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorWorkflowSessionStartService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorContextAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorProductionBoardService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCandidateListService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSavedPatternSourceExclusionService.spec.ts --reporter=dot --bail=1
                              npm run test -- --run test/operatorManifestSourceDrawService.spec.ts --reporter=dot --bail=1
          npm run test -- --run test/operatorPublishedPostLineageAuditService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestSourceCardBackfillService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorManifestSourceCardBackfillPreparationService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCandidateBatchReadService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardFamilyResolutionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardPersistencePlanningService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardLockService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorSourceCardReadService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorGenerationRunAdmissionService.spec.ts --reporter=dot --bail=1
                    npm run test -- --run test/operatorGenerationRunPersistencePlanningService.spec.ts --reporter=dot --bail=1
          npm run test -- --run test/wranglerDeployRetry.spec.ts --reporter=dot --bail=1
          npm run test -- --run manifest-autonomous-cycle.test.ts --reporter=dot --bail=1
          npm run test -- --run test/systemDirectory.spec.ts --reporter=dot --bail=1





          npm run test -- --run test/threadsPublishService.spec.ts --reporter=dot --bail=1
          npm run test -- --run test/humanFreeAutonomy.spec.ts --reporter=dot --bail=1
          npm run test -- --run test/operatorMode.spec.ts --testNamePattern="advertises the curated direct typed Main surface and concise instructions|makes the static router the only public action path|routes operational status and engineering intents deterministically away from content procedures|routes bounded known-file repository search through the main Execution Kernel without Recovery|validates complete Execution Kernel routes without mutations|rejects an MCP session created by a previous Worker deployment before routing|lists only the active static MCP registry and concise instructions|arms, executes, and re-arms the independent scheduled-post alarm with shared cron health|recovers a known Saved Pattern into complete published-post lineage|reconciles prepare_manifest_autonomous_cycle again with the same durable operation id" --reporter=dot --bail=1

                        
            
      - name: Apply exact-head database migrations
        if: steps.release_scope.outputs.migrations_changed == 'true'
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply lensically-db --remote --config wrangler.jsonc


      - name: Deploy exact validated Worker head
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                run: node scripts/run-wrangler-deploy-with-retry.mjs --config wrangler.jsonc --var "LENSICALLY_COMMIT_SHA:$(git rev-parse HEAD)"


            

      - name: Deploy exact validated web head
        if: steps.release_scope.outputs.web_changed == 'true'
        working-directory: lensically-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

            

      - name: Verify Wrangler-managed cron triggers
        if: steps.release_scope.outputs.cron_changed == 'true'
        working-directory: lensically-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          schedules_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lensically-worker/schedules"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${schedules_url}" > /tmp/lensically-cron-get.json
          jq -e '.success == true' /tmp/lensically-cron-get.json > /dev/null
          expected_crons=$(node scripts/release-preflight.mjs --print-crons | sort)
          actual_crons=$(jq -r '.result.schedules[].cron' /tmp/lensically-cron-get.json | sort)
          test "${actual_crons}" = "${expected_crons}"

      - name: Verify production runtime, scheduler, retained website, and retired legacy surfaces
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          verified=false
          for attempt in $(seq 1 45); do
            runtime_ok=false
            scheduler_ok=false
            dashboard_ok=false

            if curl --fail-with-body --silent --show-error "https://api.lensically.com/api/operator/health" > /tmp/lensically-runtime-health.json \
              && jq -e --arg sha "${expected_sha}" '.status == "ok" and .commit_sha == $sha and .execution_kernel.public_gateway == "direct_typed_tools" and (.live_tool_count >= 60)' /tmp/lensically-runtime-health.json > /dev/null; then
              runtime_ok=true
            fi
            if curl --fail-with-body --silent --show-error "https://api.lensically.com/api/operator/scheduler-health" > /tmp/lensically-scheduler-health.json \
              && jq -e '.enabled == true and .healthy == true and .operational == true and .heartbeat_fresh == true and (.control.mode == "normal") and (.current_overdue_count == 0)' /tmp/lensically-scheduler-health.json > /dev/null; then
              scheduler_ok=true
            fi
            if curl --fail-with-body --silent --show-error "https://lensically.com/dashboard" > /tmp/lensically-dashboard.html \
              && grep -q "Operator Dashboard" /tmp/lensically-dashboard.html; then
              dashboard_ok=true
            fi

            gpt_memory_status="$(curl --silent --output /tmp/gpt-memory-retired.json --write-out '%{http_code}' 'https://api.lensically.com/api/gpt-memory/dashboard' || true)"
            agent_status="$(curl --silent --output /tmp/agent-retired.json --write-out '%{http_code}' 'https://api.lensically.com/api/agent/accounts' || true)"
            intelligence_status="$(curl --silent --output /tmp/intelligence-retired.json --write-out '%{http_code}' 'https://api.lensically.com/api/threads/intelligence-dashboard' || true)"

            if [ "${runtime_ok}" = "true" ] \
              && [ "${scheduler_ok}" = "true" ] \
              && [ "${dashboard_ok}" = "true" ] \
              && [ "${gpt_memory_status}" = "410" ] \
              && [ "${agent_status}" = "410" ] \
              && [ "${intelligence_status}" = "410" ]; then
              verified=true
              break
            fi

            sleep 2
          done
          if [ "${verified}" != "true" ]; then
            cat /tmp/lensically-runtime-health.json || true
            cat /tmp/lensically-scheduler-health.json || true
            head -c 2000 /tmp/lensically-dashboard.html || true
            cat /tmp/gpt-memory-retired.json || true
            cat /tmp/agent-retired.json || true
            cat /tmp/intelligence-retired.json || true
            exit 1
          fi




