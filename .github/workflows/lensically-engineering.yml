name: Lensically Engineering

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lensically-engineering.yml"

permissions:
  contents: write

jobs:
  lom-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Patch stale LOM expectations and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("lensically-worker/test/operatorMode.spec.ts")
          text = path.read_text()
          old_public = 'expect(names).toEqual([\n      "getOperatorSessionMap",\n      "getOperatorKnowledge",\n      "getOperatorLiveState",\n      "executeOperatorReadAction",\n      "executeOperatorAction",\n      "executeOperatorCaseAction",\n      "executeOperatorHardeningAction",\n      "closeOperatorAction",\n    ]);'
          new_public = 'expect(names).toEqual([\n      "getOperatorSessionMap",\n      "getOperatorKnowledge",\n      "getOperatorLiveState",\n      "executeOperatorReadAction",\n      "executeOperatorAction",\n      "executeOperatorCaseAction",\n      "executeOperatorHardeningAction",\n      "closeOperatorAction",\n      "executeOperatorEngineeringAction",\n    ]);'
          if text.count(old_public) != 1:
              raise SystemExit(f"public lifecycle block count={text.count(old_public)}")
          text = text.replace(old_public, new_public, 1)
          for variable in ("wrongHardening", "nonCaseGatewayMismatch"):
              pattern = re.compile(rf'(expect\({variable}\.structuredContent\)\.toMatchObject\(\{{[\s\S]{{0,600}}?required_tool:\s*)"executeOperatorAction"')
              text, count = pattern.subn(r'\1"executeOperatorEngineeringAction"', text, count=1)
              if count != 1:
                  raise SystemExit(f"{variable} required_tool anchor count={count}")
          path.write_text(text)
          PY
          git config user.name "lensically-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD~4 -- .github/workflows/lensically-engineering.yml
          git rm -f .github/workflows/lom-one-shot-test-fix.yml lensically-worker/.lom-repair-trigger
          git add .github/workflows/lensically-engineering.yml lensically-worker/test/operatorMode.spec.ts
          git commit -m "Update LOM engineering gateway test expectations"
          git push origin HEAD:main
