name: LOM one-shot regression expectation repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lom-one-shot-test-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair exact LOM gateway expectations
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("lensically-worker/test/operatorMode.spec.ts")
          text = path.read_text()

          old_list = '''      "executeOperatorHardeningAction",
                "closeOperatorAction",
    ]);'''
          if old_list not in text:
              old_list = '''      "executeOperatorHardeningAction",
      "closeOperatorAction",
    ]);'''
          new_list = old_list.replace('      "closeOperatorAction",\n', '      "closeOperatorAction",\n      "executeOperatorEngineeringAction",\n')
          if text.count(old_list) != 1:
              raise SystemExit(f"public lifecycle list anchor count={text.count(old_list)}")
          text = text.replace(old_list, new_list, 1)

          for variable in ("wrongHardening", "nonCaseGatewayMismatch"):
              pattern = re.compile(
                  rf'(expect\({variable}\.structuredContent\)\.toMatchObject\(\{{[\s\S]{{0,600}}?required_tool:\s*)"executeOperatorAction"'
              )
              text, count = pattern.subn(r'\1"executeOperatorEngineeringAction"', text, count=1)
              if count != 1:
                  raise SystemExit(f"{variable} required_tool anchor count={count}")

          path.write_text(text)
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lensically-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/lom-one-shot-test-fix.yml
          git add lensically-worker/test/operatorMode.spec.ts
          git commit -m "Update LOM engineering gateway test expectations"
          git push origin HEAD:main
