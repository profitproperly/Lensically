name: Lensically Commercial Checkout Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live sales page and embedded Checkout session
        shell: bash
        run: |
          set -euo pipefail

                              page="$(curl --fail --silent --show-error https://lensically.com/operator/)"
          if grep -Fq 'id="embedded-checkout"' <<<"$page"; then
            echo 'sales-page-embedded-container=ok'
          else
            echo 'sales-page-embedded-container=missing'
            exit 21
          fi
          if grep -Fq 'https://js.stripe.com/clover/stripe.js' <<<"$page"; then
            echo 'sales-page-stripe-js=ok'
          else
            echo 'sales-page-stripe-js=missing'
            exit 22
          fi
          if grep -Fq 'api.lensically.com/api/commercial/embedded-checkout-session' <<<"$page"; then
            echo 'sales-page-endpoint-reference=ok'
          else
            echo 'sales-page-endpoint-reference=missing'
            exit 23
          fi



          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://lensically.com' \
            --header 'Accept: application/json' \
            https://api.lensically.com/api/commercial/embedded-checkout-session)"

                    echo "embedded-endpoint-http=$status"
          test "$status" = "200"
          if grep -iq '^access-control-allow-origin: https://lensically.com' "$headers"; then
            echo 'embedded-endpoint-cors=ok'
          else
            echo 'embedded-endpoint-cors=missing'
            exit 1
          fi

          node - "$body" <<'NODE'

          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid = payload.ok === true
            && typeof payload.publishable_key === 'string'
            && payload.publishable_key.startsWith('pk_live_')
            && typeof payload.client_secret === 'string'
            && payload.client_secret.includes('_secret_')
            && typeof payload.session_id === 'string'
            && payload.session_id.startsWith('cs_live_');
                    console.log(`payload-ok=${payload.ok === true}`);
          console.log(`publishable-key-live=${typeof payload.publishable_key === 'string' && payload.publishable_key.startsWith('pk_live_')}`);
          console.log(`client-secret-present=${typeof payload.client_secret === 'string' && payload.client_secret.includes('_secret_')}`);
          console.log(`live-session-present=${typeof payload.session_id === 'string' && payload.session_id.startsWith('cs_live_')}`);
          console.log(`error-code=${typeof payload.error === 'string' ? payload.error : 'none'}`);
          if (!valid) process.exit(1);
          console.log('Live embedded Checkout smoke passed without exposing checkout credentials.');

          NODE
