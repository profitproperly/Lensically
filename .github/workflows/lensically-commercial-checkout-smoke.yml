name: Lensically Commercial Checkout Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare production topology
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_missing');
          const headers = { Authorization: `Bearer ${token}` };
          const api = 'https://api.cloudflare.com/client/v4';
          const read = async (url) => {
            const response = await fetch(url, { headers });
            const payload = await response.json();
            if (!response.ok || !payload?.success) throw new Error(`cloudflare_read_failed_${response.status}`);
            return payload.result;
          };

          const project = await read(`${api}/accounts/${account}/pages/projects/lensically-operator`);
          const latest = project?.latest_deployment || {};
          const trigger = latest?.deployment_trigger?.metadata || {};
          console.log(`pages-project=${project?.name || 'unknown'}`);
          console.log(`pages-production-branch=${project?.production_branch || 'unknown'}`);
          console.log(`pages-domains=${Array.isArray(project?.domains) ? project.domains.join(',') : 'none'}`);
          console.log(`pages-latest-url=${latest?.url || 'unknown'}`);
          console.log(`pages-latest-branch=${trigger?.branch || 'unknown'}`);

          const projects = await read(`${api}/accounts/${account}/pages/projects`);
          for (const entry of Array.isArray(projects) ? projects : []) {
            const domains = Array.isArray(entry?.domains) ? entry.domains : [];
            if (domains.some((domain) => String(domain).includes('lensically'))) {
              console.log(`pages-map=${entry.name}:${domains.join('|')}`);
            }
          }
          NODE

      - name: Verify live sales page and embedded Checkout session
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            label="$1"
            url="$2"
            page="$(curl --fail --silent --show-error "$url")"
            if grep -Fq 'id="embedded-checkout"' <<<"$page"; then
              echo "$label-embedded-container=ok"
            else
              echo "$label-embedded-container=missing"
              return 21
            fi
            if grep -Fq 'https://js.stripe.com/clover/stripe.js' <<<"$page"; then
              echo "$label-stripe-js=ok"
            else
              echo "$label-stripe-js=missing"
              return 22
            fi
            if grep -Fq 'api.lensically.com/api/commercial/embedded-checkout-session' <<<"$page"; then
              echo "$label-endpoint-reference=ok"
            else
              echo "$label-endpoint-reference=missing"
              return 23
            fi
          }

                    check_page operator-sales https://lensically.com/operator/

                                        sales_root="$(curl --fail --silent --show-error https://lensically.com/)"
          if grep -Fq 'Open%20https%3A%2F%2Flensically.com%2Fai%20directly%20and%20read%20the%20current%20live%20page' <<<"$sales_root" && grep -Fq 'Reference%20revision%202026-08-11.3' <<<"$sales_root"; then
            echo 'sales-root-ai-clean-current-brief-handoff=ok'
          else
            echo 'sales-root-ai-clean-current-brief-handoff=missing'
            exit 29
          fi
          if grep -Fq 'lensically.com%2Fai%3F' <<<"$sales_root"; then
            echo 'sales-root-ai-query-string-regression=present'
            exit 30
          fi
          if grep -Fq '<span class="price">$97</span>' <<<"$sales_root"; then
            echo 'sales-root-price-97=ok'
          else
            echo 'sales-root-price-97=missing'
            exit 25
          fi
                              if grep -Fq '$977' <<<"$sales_root"; then
            echo 'sales-root-stale-price-977=present'
            exit 26
          else
            echo 'sales-root-stale-price-977=absent'
          fi

                    if grep -Fq 'property="og:image" content="https://lensically.com/brand/lensically-sales-preview-1200x630.png"' <<<"$sales_root" \
            && grep -Fq 'property="og:image:width" content="1200"' <<<"$sales_root" \
            && grep -Fq 'property="og:image:height" content="630"' <<<"$sales_root" \
            && grep -Fq 'name="twitter:card" content="summary_large_image"' <<<"$sales_root" \
            && grep -Fq 'rel="apple-touch-icon" sizes="180x180" href="/brand/lensically-flat-180.png"' <<<"$sales_root" \
            && grep -Fq 'rel="icon" type="image/png" sizes="32x32" href="/brand/lensically-tab-rounded-32.png"' <<<"$sales_root" \
            && grep -Fq 'rel="icon" type="image/png" sizes="16x16" href="/brand/lensically-tab-rounded-16.png"' <<<"$sales_root" \
            && grep -Fq 'rel="manifest" href="/site.webmanifest"' <<<"$sales_root"; then
            echo 'sales-root-brand-metadata=ok'
          else
            echo 'sales-root-brand-metadata=missing'
            exit 31
          fi

          if grep -Fq 'raw.githubusercontent.com/profitproperly/Lensically/main/lensically-web/public/lensically-logo-white-with-black-bg.png' <<<"$sales_root"; then
            echo 'sales-root-remote-github-logo-regression=present'
            exit 32
          fi
          brand_manifest="$(curl --fail --silent --show-error https://lensically.com/site.webmanifest)"
                    if jq -e '.name == "Lensically Operator for Threads" and (.icons | any(.src == "/brand/lensically-flat-192.png" and .sizes == "192x192")) and (.icons | any(.src == "/brand/lensically-flat-512.png" and .sizes == "512x512"))' <<<"$brand_manifest" > /dev/null; then

            echo 'sales-root-brand-manifest=ok'
          else
            echo 'sales-root-brand-manifest=invalid'
            exit 33
          fi
                    for icon_url in \
            https://lensically.com/brand/lensically-tab-rounded-16.png \
            https://lensically.com/brand/lensically-tab-rounded-32.png \
            https://lensically.com/brand/lensically-flat-180.png \
            https://lensically.com/brand/lensically-flat-192.png \
            https://lensically.com/brand/lensically-flat-512.png \
            https://lensically.com/brand/lensically-sales-preview-1200x630.png \
            https://lensically.com/favicon.ico; do

            icon_type="$(curl --fail --silent --show-error --location --head "$icon_url" | tr -d '\r' | awk -F': ' 'tolower($1) == "content-type" {print tolower($2); exit}')"
            if [[ "$icon_type" != image/png* ]]; then
              echo "brand-icon-content-type-invalid url=$icon_url type=$icon_type"
              exit 34
            fi
          done
          echo 'sales-root-brand-icons=ok'

          ai_advisory="$(curl --fail --silent --show-error https://lensically.com/ai/)"
          if grep -Fq '$97' <<<"$ai_advisory"; then
            echo 'ai-advisory-price-97=ok'
          else
            echo 'ai-advisory-price-97=missing'
            exit 27
          fi
          if grep -Fq '$977' <<<"$ai_advisory"; then
            echo 'ai-advisory-stale-price-977=present'
            exit 28
          else
            echo 'ai-advisory-stale-price-977=absent'
          fi

          app_status="$(curl --silent --show-error --output /tmp/app-root.html --write-out '%{http_code}' --location https://app.lensically.com/)"
          echo "app-root-http=$app_status"
          test "$app_status" = "200"
          if grep -Eq 'Lensically|dashboard|__next' /tmp/app-root.html; then
            echo 'app-operational-root=ok'
          else
            echo 'app-operational-root=missing'
            exit 24
          fi

          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://lensically.com' \
            --header 'Accept: application/json' \
            https://api.lensically.com/api/commercial/embedded-checkout-session)"

          echo "embedded-endpoint-http=$status"
          test "$status" = "200"
          if grep -iq '^access-control-allow-origin: https://lensically.com' "$headers"; then
            echo 'embedded-endpoint-cors=ok'
          else
            echo 'embedded-endpoint-cors=missing'
            exit 31
          fi

          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const checks = {
            ok: payload.ok === true,
            publishable: typeof payload.publishable_key === 'string' && payload.publishable_key.startsWith('pk_live_'),
            clientSecret: typeof payload.client_secret === 'string' && payload.client_secret.includes('_secret_'),
            liveSession: typeof payload.session_id === 'string' && payload.session_id.startsWith('cs_live_'),
          };
          console.log(`payload-ok=${checks.ok}`);
          console.log(`publishable-key-live=${checks.publishable}`);
          console.log(`client-secret-present=${checks.clientSecret}`);
          console.log(`live-session-present=${checks.liveSession}`);
          console.log(`error-code=${typeof payload.error === 'string' ? payload.error : 'none'}`);
          if (!Object.values(checks).every(Boolean)) process.exit(41);
          console.log('Live embedded Checkout endpoint passed without exposing checkout credentials.');
          NODE
          echo 'live-commercial-checkout=ok'
