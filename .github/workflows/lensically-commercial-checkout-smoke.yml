name: Lensically Commercial Checkout Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live sales page and embedded Checkout session
        shell: bash
        run: |
          set -euo pipefail

          page="$(curl --fail --silent --show-error https://lensically.com/operator/)"
          grep -Fq 'id="embedded-checkout"' <<<"$page"
          grep -Fq 'https://js.stripe.com/clover/stripe.js' <<<"$page"
          grep -Fq 'api.lensically.com/api/commercial/embedded-checkout-session' <<<"$page"

          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://lensically.com' \
            --header 'Accept: application/json' \
            https://api.lensically.com/api/commercial/embedded-checkout-session)"

          test "$status" = "200"
          grep -iq '^access-control-allow-origin: https://lensically.com' "$headers"

          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid = payload.ok === true
            && typeof payload.publishable_key === 'string'
            && payload.publishable_key.startsWith('pk_live_')
            && typeof payload.client_secret === 'string'
            && payload.client_secret.includes('_secret_')
            && typeof payload.session_id === 'string'
            && payload.session_id.startsWith('cs_live_');
          if (!valid) process.exit(1);
          console.log('Live embedded Checkout smoke passed without exposing checkout credentials.');
          NODE
