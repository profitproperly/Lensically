name: Lensically Commercial Checkout Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Remove obsolete Pages apex association
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_missing');
          const headers = { Authorization: `Bearer ${token}` };
          const api = 'https://api.cloudflare.com/client/v4';
          const projectName = 'lensically-operator';
          const apex = 'lensically.com';
          const read = async (url) => {
            const response = await fetch(url, { headers });
            const payload = await response.json();
            if (!response.ok || !payload?.success) throw new Error(`cloudflare_read_failed_${response.status}`);
            return payload.result;
          };
          let project = await read(`${api}/accounts/${account}/pages/projects/${projectName}`);
          const domains = Array.isArray(project?.domains) ? project.domains : [];
          if (domains.includes(apex)) {
            const response = await fetch(`${api}/accounts/${account}/pages/projects/${projectName}/domains/${encodeURIComponent(apex)}`, { method: 'DELETE', headers });
            const payload = await response.json();
            if (!response.ok || !payload?.success) throw new Error(`pages_apex_delete_failed_${response.status}`);
            console.log('obsolete-pages-apex-association=removed');
          } else {
            console.log('obsolete-pages-apex-association=already-absent');
          }
          project = await read(`${api}/accounts/${account}/pages/projects/${projectName}`);
          if ((Array.isArray(project?.domains) ? project.domains : []).includes(apex)) {
            throw new Error('obsolete_pages_apex_association_still_present');
          }
          console.log('obsolete-pages-apex-association=absent');
          NODE

      - name: Inspect Cloudflare production topology
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('cloudflare_credentials_missing');
          const headers = { Authorization: `Bearer ${token}` };
          const api = 'https://api.cloudflare.com/client/v4';
          const read = async (url) => {
            const response = await fetch(url, { headers });
            const payload = await response.json();
            if (!response.ok || !payload?.success) throw new Error(`cloudflare_read_failed_${response.status}`);
            return payload.result;
          };

          const project = await read(`${api}/accounts/${account}/pages/projects/lensically-operator`);
          const latest = project?.latest_deployment || {};
          const trigger = latest?.deployment_trigger?.metadata || {};
          console.log(`pages-project=${project?.name || 'unknown'}`);
          console.log(`pages-production-branch=${project?.production_branch || 'unknown'}`);
          console.log(`pages-domains=${Array.isArray(project?.domains) ? project.domains.join(',') : 'none'}`);
          console.log(`pages-latest-url=${latest?.url || 'unknown'}`);
          console.log(`pages-latest-branch=${trigger?.branch || 'unknown'}`);

          const projects = await read(`${api}/accounts/${account}/pages/projects`);
          for (const entry of Array.isArray(projects) ? projects : []) {
            const domains = Array.isArray(entry?.domains) ? entry.domains : [];
            if (domains.some((domain) => String(domain).includes('lensically'))) {
              console.log(`pages-map=${entry.name}:${domains.join('|')}`);
            }
          }

          const zones = await read(`${api}/zones?name=lensically.com`);
          const zone = Array.isArray(zones) ? zones[0] : null;
          if (zone?.id) {
            try {
              const dns = await read(`${api}/zones/${zone.id}/dns_records?per_page=100`);
              for (const record of Array.isArray(dns) ? dns : []) {
                if (['lensically.com', 'app.lensically.com', 'api.lensically.com'].includes(record.name)) {
                  console.log(`dns=${record.type}:${record.name}:${record.content}:proxied=${record.proxied}`);
                }
              }
            } catch {
              console.log('dns-read=unavailable');
            }
            try {
              const routes = await read(`${api}/zones/${zone.id}/workers/routes`);
              for (const route of Array.isArray(routes) ? routes : []) {
                if (String(route?.pattern || '').includes('lensically.com')) {
                  console.log(`worker-route=${route.pattern}:${route.script || 'none'}`);
                }
              }
            } catch {
              console.log('worker-route-read=unavailable');
            }
          } else {
            console.log('lensically-zone=missing');
          }
          NODE

      - name: Verify live sales page and embedded Checkout session
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            label="$1"
            url="$2"
            page="$(curl --fail --silent --show-error "$url")"
            if grep -Fq 'id="embedded-checkout"' <<<"$page"; then
              echo "$label-embedded-container=ok"
            else
              echo "$label-embedded-container=missing"
              return 21
            fi
            if grep -Fq 'https://js.stripe.com/clover/stripe.js' <<<"$page"; then
              echo "$label-stripe-js=ok"
            else
              echo "$label-stripe-js=missing"
              return 22
            fi
            if grep -Fq 'api.lensically.com/api/commercial/embedded-checkout-session' <<<"$page"; then
              echo "$label-endpoint-reference=ok"
            else
              echo "$label-endpoint-reference=missing"
              return 23
            fi
          }

          check_page operator-sales https://lensically.com/operator/

          app_status="$(curl --silent --show-error --output /tmp/app-root.html --write-out '%{http_code}' --location https://app.lensically.com/)"
          echo "app-root-http=$app_status"
          test "$app_status" = "200"
          if grep -Eq 'Lensically|dashboard|__next' /tmp/app-root.html; then
            echo 'app-operational-root=ok'
          else
            echo 'app-operational-root=missing'
            exit 24
          fi

          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://lensically.com' \
            --header 'Accept: application/json' \
            https://api.lensically.com/api/commercial/embedded-checkout-session)"

          echo "embedded-endpoint-http=$status"
          test "$status" = "200"
          if grep -iq '^access-control-allow-origin: https://lensically.com' "$headers"; then
            echo 'embedded-endpoint-cors=ok'
          else
            echo 'embedded-endpoint-cors=missing'
            exit 31
          fi

          node - "$body" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const checks = {
            ok: payload.ok === true,
            publishable: typeof payload.publishable_key === 'string' && payload.publishable_key.startsWith('pk_live_'),
            clientSecret: typeof payload.client_secret === 'string' && payload.client_secret.includes('_secret_'),
            liveSession: typeof payload.session_id === 'string' && payload.session_id.startsWith('cs_live_'),
          };
          console.log(`payload-ok=${checks.ok}`);
          console.log(`publishable-key-live=${checks.publishable}`);
          console.log(`client-secret-present=${checks.clientSecret}`);
          console.log(`live-session-present=${checks.liveSession}`);
          console.log(`error-code=${typeof payload.error === 'string' ? payload.error : 'none'}`);
          if (!Object.values(checks).every(Boolean)) process.exit(41);
          console.log('Live embedded Checkout endpoint passed without exposing checkout credentials.');
          NODE
          echo 'live-commercial-checkout=ok'
